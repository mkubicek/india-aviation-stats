name: Update Data & Charts

on:
  schedule:
    # 5th of each month at 08:00 UTC
    - cron: "0 8 5 * *"
  workflow_dispatch:
    inputs:
      generate_gifs:
        description: "Generate GIF animations (slow)"
        type: boolean
        default: true
      dry_run:
        description: "Dry run — skip commit/push (for pipeline testing)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Restore raw data cache
        id: raw-cache
        uses: actions/cache/restore@v6
        with:
          path: data/raw.tar.zst
          key: raw-data-v4-${{ hashFiles('scripts/fetch.py', 'scripts/normalize.py', 'pyproject.toml', 'uv.lock') }}-${{ runner.os }}
          restore-keys: |
            raw-data-v4-

      - name: Extract cached raw data
        if: hashFiles('data/raw.tar.zst') != ''
        run: |
          mkdir -p data/raw
          tar --zstd -xf data/raw.tar.zst -C data/
          rm -f data/raw.tar.zst
          echo "Cached raw files:"
          find data/raw -type f | wc -l
          du -sh data/raw || true

      # Tests run after raw is restored so raw-dependent integration tests
      # execute on warm-cache runs; they skip cleanly when raw is absent.
      - name: Run tests
        run: uv run pytest -q

      - name: Fetch data
        id: download
        run: uv run python scripts/fetch.py
        env:
          DOWNLOAD_TIMEOUT: "600"

      - name: Re-pack raw data cache
        if: always()
        run: |
          if [ -d data/raw ] && find data/raw -type f | grep -q .; then
            tar --zstd -cf data/raw.tar.zst -C data raw/
            du -sh data/raw.tar.zst
          fi

      - name: Save raw data cache
        if: always() && hashFiles('data/raw.tar.zst') != ''
        uses: actions/cache/save@v6
        with:
          path: data/raw.tar.zst
          key: raw-data-v4-${{ hashFiles('scripts/fetch.py', 'scripts/normalize.py', 'pyproject.toml', 'uv.lock') }}-${{ github.run_id }}

      - name: Clean data into canonical CSV datasets
        if: steps.download.outputs.timed_out != 'true'
        run: uv run python scripts/clean.py

      - name: Validate (BLOCKING gate + assumptions ledger + revision log)
        id: validate
        if: steps.download.outputs.timed_out != 'true'
        continue-on-error: true
        run: PYTHONPATH=scripts uv run python -m validate --assumptions --revisions

      # Stale-data governance: a BLOCKING gate failure (e.g. an unclassified
      # overlap from a new DGCA label, or a TRIGGERED assumption) keeps the
      # last-good published data and opens an issue — it never silently ships a
      # now-wrong merge. Clean newcomers stay advisory and still publish.
      - name: Open issue on validation failure
        if: steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Data validation gate failed on ${new Date().toISOString().slice(0,10)}`;
            const body = [
              'The monthly refresh hit a BLOCKING validation failure, so the published',
              'data was **not** updated (last-good kept). Most likely a new DGCA label',
              'overlaps an existing airport and needs classifying in `mappings.yaml`,',
              'or an assumption TRIGGERED.',
              '',
              'See the failed run and `data/processed/validation_report.json`.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['data-quality'],
            });

      - name: Generate charts and dashboard summary
        if: steps.download.outputs.timed_out != 'true' && steps.validate.outcome == 'success'
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.generate_gifs }}" == "true" ]]; then
            uv run python scripts/chart.py --include-gifs
          else
            uv run python scripts/chart.py
          fi

      - name: Commit and push
        if: steps.download.outputs.timed_out != 'true' && steps.validate.outcome == 'success' && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/ charts/ index.html .nojekyll assumptions/index.md
          [ -f data/sources_manifest.csv ] && git add data/sources_manifest.csv || true
          if [ -s warnings.log ]; then
            git add -f warnings.log
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update data and charts $(date +%Y-%m-%d)"
            git push
          fi

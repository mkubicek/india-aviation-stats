name: Update Data & Charts

on:
  schedule:
    # 5th of each month at 08:00 UTC
    - cron: "0 8 5 * *"
  workflow_dispatch:
    inputs:
      generate_gifs:
        description: "Generate GIF animations (slow)"
        type: boolean
        default: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Restore cached raw data
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-data-${{ hashFiles('scripts/download.py') }}-${{ github.run_id }}
          restore-keys: |
            raw-data-${{ hashFiles('scripts/download.py') }}-
            raw-data-

      - name: Download data
        run: uv run python scripts/download.py
        env:
          DOWNLOAD_TIMEOUT: "600"

      - name: Save raw data cache
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-data-${{ hashFiles('scripts/download.py') }}-${{ github.run_id }}

      - name: Process data
        run: uv run python scripts/process.py

      - name: Validate data
        run: uv run python scripts/validate.py

      - name: Run projections
        run: uv run python scripts/project.py

      - name: Generate charts
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.generate_gifs }}" == "true" ]]; then
            uv run python scripts/chart.py
          else
            uv run python scripts/chart.py --skip-gifs
          fi

      - name: Generate report
        run: uv run python scripts/report.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/ charts/ reports/ warnings.log
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update data and charts $(date +%Y-%m-%d)"
            git push
          fi

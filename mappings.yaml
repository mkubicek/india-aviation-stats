# ─────────────────────────────────────────────────────────────
# Key milestones (for chart annotations)
# ─────────────────────────────────────────────────────────────

milestones:
  - date: "2016-10"
    label: "UDAN scheme launched"
    description: "Regional Connectivity Scheme to subsidise routes to underserved airports"

  - date: "2017-01"
    label: "Demonetisation aftermath"
    description: "Short-term demand shock after Nov 2016 demonetisation"

  - date: "2019-04"
    label: "Jet Airways ceases operations"
    description: "India's oldest private airline shuts down; capacity gap"

  - date: "2020-03"
    label: "COVID-19 lockdown"
    description: "All domestic flights suspended 25 Mar – 25 May 2020"

  - date: "2020-05"
    label: "Vande Bharat Mission"
    description: "Evacuation flights; phased domestic restart"

  - date: "2021-05"
    label: "Second COVID wave"
    description: "Delta variant wave; state-level restrictions"

  - date: "2022-03"
    label: "Full recovery milestone"
    description: "Domestic traffic exceeds pre-COVID levels"

  - date: "2022-10"
    label: "Akasa Air launches"
    description: "New LCC enters market with 737 MAX fleet"

  - date: "2023-01"
    label: "Air India mega-order"
    description: "Air India orders 470 aircraft (Airbus + Boeing)"

  - date: "2023-05"
    label: "Go First ceases operations"
    description: "Budget carrier files for insolvency"

  - date: "2023-10"
    label: "Manohar (Goa) airport opens"
    description: "New greenfield airport operational"

  - date: "2024-07"
    label: "Rajkot Hirasar opens"
    description: "Gujarat's newest airport; 1.08M pax first year"

  - date: "2024-11-17"
    label: "Record single day"
    description: "505,000 domestic passengers — all-time record"

  - date: "2024-11"
    label: "Vistara merges into Air India"
    description: "Tata Group consolidation; Air India becomes full-service + LCC"

  - date: "2025-12"
    label: "NMIA opening (planned)"
    description: "Navi Mumbai International Airport Phase 1: 20M capacity"

  - date: "2026-04"
    label: "NIA opening (planned)"
    description: "Noida International Airport Phase 1: 12M capacity"

  - date: "2027-06"
    label: "Bhogapuram opening (planned)"
    description: "Andhra Pradesh greenfield; Phase 1: 6M capacity"


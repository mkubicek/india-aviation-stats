[project]
name = "india-aviation-stats"
version = "0.1.0"
description = "A clean, canonical dataset of Indian aviation passenger traffic from DGCA, with charts"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "requests>=2.28",
    "openpyxl>=3.1",
    "numpy>=1.24",
    "Pillow>=10.0",
    "xlrd>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.uv]
managed = true
package = false

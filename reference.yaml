# Validation reference data
# Sources: DGCA annual reports, AAI traffic data, industry publications
# Used by validate.py for plausibility checks (advisory, never blocks pipeline)

# National annual passenger totals (domestic + international, millions)
# Indian Financial Year (Apr–Mar): FY label uses starting year
# e.g. fy2024 = FY2024-25 = April 2024 – March 2025

national_passengers:
  # Calendar year totals from World Bank (IS.AIR.PSGR) where available,
  # supplemented by DGCA annual reports
  2015: 190000000
  2016: 218000000
  2017: 252000000
  2018: 275000000
  2019: 274000000    # Jet Airways shutdown partially offset by others
  2020: 86000000     # COVID-19 severe impact
  2021: 143000000    # Partial recovery
  2022: 253000000    # Strong rebound
  2023: 305000000
  2024: 330000000    # Estimate based on FY data

  # Financial year totals (DGCA official)
  fy2023: 296000000   # FY2023-24
  fy2024: 340700000   # FY2024-25 (340.7M per DGCA)

# Major airport annual passengers (most recent full FY available)

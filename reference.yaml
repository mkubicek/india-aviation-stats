  MAA: 24000000      # Chennai
  CCU: 22000000      # Kolkata
  COK: 11000000      # Kochi
  AMD: 12000000      # Ahmedabad
  GOI: 9500000       # Goa (Manohar + Dabolim combined)
  PNQ: 9000000       # Pune
  GAU: 7010000       # Guwahati (CY2025: 7.01M)
  JAI: 7500000       # Jaipur
  LKO: 6500000       # Lucknow
  PAT: 5500000       # Patna

